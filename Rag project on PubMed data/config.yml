ST_CONFIGS:
  bge:
    name: BAAI/bge-base-en-v1.5
    max_length: 512
    # BGE: no prefix for documents, instruction prefix for queries
    query_prefix: "Represent this sentence for searching relevant passages: "
  qwen3:
    name: Qwen/Qwen3-Embedding-0.6B
    max_length: 8192
    # Qwen3: no prompt for documents, built-in 'query' prompt for queries
    query_prompt_name: query

MEDCPT:
  article_encoder: ncbi/MedCPT-Article-Encoder
  query_encoder: ncbi/MedCPT-Query-Encoder
  article_max_length: 512
  query_max_length: 64
